<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0c07" />
<title>The Big Glitch — Chapter Zero: The Moosh</title>
<style>
  :root { --paper:#e8d9b0; --ink:#141008; --glow:#ffb14a; --ground:#0a0c07; --line:#4a3a20; --panel:#12160c; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:var(--ground); touch-action:none;
    font-family: Georgia, 'Times New Roman', serif; user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  #sceneWrap { position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#070905; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display:block; }

  /* ---- The Book panel (portrait) / caption bar (landscape) ---- */
  #book { position:relative; background:linear-gradient(180deg,#1a2010,#0d1008);
    border-top:2px solid #4a3a20; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    color:var(--paper); display:none; flex-direction:column; gap:8px; }
  body.portrait #book { display:flex; min-height:31%; max-height:38%; }
  body.landscape #caption { position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(12px + env(safe-area-inset-bottom)); max-width:min(620px,86%); z-index:30; }
  body.portrait #caption { display:none; }

  .cap { font-style:italic; font-size:clamp(15px,2.4vh,19px); line-height:1.45;
    background:rgba(10,12,6,.92); border:1px solid #3a2e14; border-left:3px solid var(--glow);
    padding:10px 14px; border-radius:2px; color:var(--paper); opacity:0; transition:opacity .45s; }
  .cap.show { opacity:1; }
  .cap .who { display:block; font-style:normal; font-size:11px; letter-spacing:2px; color:#b08a4a; margin-bottom:3px; }
  .cap.inner { font-family:'Courier New',monospace; font-style:normal; border-left-color:#7adfff; }

  #hud { position:absolute; top:calc(8px + env(safe-area-inset-top)); right:10px; z-index:40; display:flex; gap:8px; }
  .hbtn { width:42px; height:42px; border-radius:10px; border:1px solid var(--line); background:rgba(10,12,6,.85);
    color:var(--paper); font-size:19px; font-family:Georgia,serif; display:flex; align-items:center; justify-content:center; }
  .hbtn:active { background:#3a2e14; }
  #inv { position:absolute; top:calc(8px + env(safe-area-inset-top)); left:10px; z-index:40; display:flex; gap:8px; }
  .invchip { display:none; align-items:center; gap:7px; padding:7px 12px; border-radius:10px;
    border:1px solid #4a6a2e; background:rgba(12,18,6,.88); color:#c8dfa0; font-size:13px; font-family:'Courier New',monospace; }
  .invchip.show { display:flex; }

  /* ---- Phone overlay ---- */
  #phone { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
    background:rgba(4,3,10,.55); backdrop-filter:blur(2px);
    padding:calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom)); }
  #phone.show { display:flex; }
  #phoneBody { width:min(370px,94vw); height:min(660px,100%); max-height:100%; background:#0e1018; border:2px solid #2a2f45;
    border-radius:26px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 0 70px rgba(122,223,255,.22); }
  #phoneExit { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:65;
    width:44px; height:44px; border-radius:50%; border:1px solid #56608c; background:rgba(10,12,24,.92);
    color:#cfe0ff; font-size:18px; line-height:1; }
  #phoneTop { padding:12px 16px 10px; background:#121627; color:#9aa4d6; font-family:'Courier New',monospace;
    font-size:13px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #232a44; }
  #phoneClose { width:30px; height:30px; border-radius:50%; border:1px solid #3b4368; background:#151a2e;
    color:#9aa4d6; font-size:14px; line-height:1; }
  #chat { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:9px 12px; border-radius:14px; font-size:14.5px; line-height:1.4; font-family:'Helvetica Neue',Arial,sans-serif; }
  .msg.bot { background:#1b2138; color:#dfe4ff; border-bottom-left-radius:4px; align-self:flex-start; }
  .msg.bot .tag { display:block; font-size:10px; letter-spacing:1.5px; color:#7f8ac2; margin-bottom:3px; }
  .msg.me { background:#3b2f63; color:#fff; border-bottom-right-radius:4px; align-self:flex-end; }
  .msg.sys { background:none; color:#6d7396; font-size:11.5px; align-self:center; font-family:'Courier New',monospace; text-align:center; }
  #choices { padding:10px 12px calc(12px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; background:#0a0c14; border-top:1px solid #232a44; }
  .choice { padding:11px 14px; border-radius:12px; border:1px solid #3b4368; background:#151a2e; color:#e8ecff;
    font-size:14.5px; text-align:left; font-family:'Helvetica Neue',Arial,sans-serif; }
  .choice:active { background:#232b4d; }
  .choice.danger { border-color:#7a2d3c; background:#2a1119; color:#ff9daf; }

  /* ---- Camera viewfinder ---- */
  #cam { position:absolute; inset:0; z-index:70; display:none; pointer-events:none; }
  #cam.show { display:block; }
  #cam button { pointer-events:auto; }
  body.cammode #caption { display:none; }
  #camHud { position:absolute; inset:0; pointer-events:none; border:3px solid rgba(255,255,255,.15); }
  #camHint { position:absolute; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    color:#cfe0ff; font-family:'Courier New',monospace; font-size:13px; background:rgba(10,12,24,.8); padding:6px 12px; border-radius:8px; }
  #camBar { position:absolute; bottom:calc(16px + env(safe-area-inset-bottom)); left:0; right:0; display:flex; justify-content:center; gap:18px; align-items:center; }
  #shutter { width:66px; height:66px; border-radius:50%; border:4px solid #fff; background:rgba(255,255,255,.25); }
  #shutter:active { background:#fff; }
  #camClose { width:46px; height:46px; border-radius:50%; border:1px solid #56608c; background:rgba(10,12,24,.8); color:#cfe0ff; font-size:18px; }

  /* ---- Start / end pages ---- */
  .page { position:absolute; inset:0; z-index:100; background:
    radial-gradient(120% 90% at 50% 10%, #241a09 0%, #0a0c07 60%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--paper); padding:24px; }
  .page h1 { font-size:clamp(34px,8vw,64px); letter-spacing:4px; font-weight:normal; }
  .page h1 .g { color:var(--glow); }
  .page .sub { margin-top:10px; font-style:italic; color:#b08a4a; font-size:clamp(14px,2.4vw,18px); }
  .page .go { margin-top:38px; padding:14px 34px; border:1px solid #a86a28; border-radius:3px; background:rgba(58,46,20,.5);
    color:var(--paper); font-family:Georgia,serif; font-size:17px; font-style:italic; }
  .page .go:active { background:#4a3a20; }
  .page .tiny { position:absolute; bottom:calc(14px + env(safe-area-inset-bottom)); font-size:11px; color:#6e5a34; font-style:italic; }
  #themes { margin-top:26px; display:flex; gap:10px; }
  .themeBtn { display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:3px;
    border:1px solid #3a3020; background:rgba(20,18,10,.6); color:#b0a486; font-family:Georgia,serif;
    font-size:13px; font-style:italic; }
  .themeBtn .sw { width:16px; height:16px; border-radius:4px; display:inline-block; }
  .themeBtn.sel { border-color:var(--glow); color:var(--paper); }
  #endPage { display:none; }
  #counterBig { font-family:'Courier New',monospace; font-size:clamp(40px,10vw,84px); color:#ff8a5e; letter-spacing:3px; }
  button { cursor:pointer; }
</style>
</head>
<body class="landscape">
  <div id="app">
    <div id="sceneWrap">
      <div id="hud">
        <button class="hbtn" id="btnReveal" title="what can I touch?">✧</button>
        <button class="hbtn" id="btnPhone" title="phone">✆</button>
      </div>
      <div id="inv"><div class="invchip" id="chipParsley">✿ immortal parsley</div></div>
      <div id="caption"><div class="cap" id="capBox"></div></div>

      <div id="cam">
        <div id="camHud"></div>
        <div id="camHint">DRONE-CAM · tap a thing, then the shutter</div>
        <div id="camBar">
          <button id="camClose">✕</button>
          <button id="shutter" aria-label="shutter"></button>
          <div style="width:46px"></div>
        </div>
      </div>

      <div id="phone">
        <button id="phoneExit" aria-label="put the phone down">✕</button>
        <div id="phoneBody">
          <div id="phoneTop"><span>NOURLY⁺</span><span id="clock">02:07</span><span>▂▄▆ 5G∞</span><button id="phoneClose">✕</button></div>
          <div id="chat"></div>
          <div id="choices"></div>
        </div>
      </div>
    </div>
    <div id="book"><div class="cap" id="capBoxP"></div></div>
  </div>

  <div class="page" id="startPage">
    <h1>THE BIG <span class="g">GLITCH</span></h1>
    <div class="sub">a playable book · chapter zero, page one</div>
    <div class="sub" style="margin-top:26px">02:07 am. Somewhere, it is raining.<br/>Somewhere, dinner has arrived.</div>
    <button class="go" id="btnStart">open the book</button>
    <div id="themes">
      <button class="themeBtn" data-theme="a"><span class="sw" style="background:linear-gradient(135deg,#ffb14a,#161d12)"></span>sodium</button>
      <button class="themeBtn" data-theme="b"><span class="sw" style="background:linear-gradient(135deg,#ff4fd8,#151028)"></span>twilight</button>
      <button class="themeBtn" data-theme="c"><span class="sw" style="background:linear-gradient(135deg,#5eeaff,#0c181a)"></span>petrol</button>
      <button class="themeBtn" data-theme="d"><span class="sw" style="background:linear-gradient(135deg,#ff6a3d,#3d9dbf)"></span>print run</button>
    </div>
    <button class="themeBtn" id="btnBlockout" style="margin-top:12px"></button>
    <div class="tiny">100% manual · vertical slice</div>
  </div>

  <div class="page" id="endPage">
    <div class="sub" style="letter-spacing:3px">ACCOUNTS TERMINATED TONIGHT</div>
    <div id="counterBig">1</div>
    <div class="sub" id="endLine" style="max-width:560px; margin-top:18px; font-size:clamp(15px,2.6vw,19px)"></div>
    <button class="go" id="btnAgain">read this page again</button>
    <div class="tiny">to be continued — 555,788 to go</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
