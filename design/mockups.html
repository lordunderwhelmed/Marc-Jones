<script>
// ============ shared helpers ============
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return[c,x];}
function dith(c,x,y,w,h,c1,c2,horiz){c.fillStyle=c1;c.fillRect(x,y,w,h);c.fillStyle=c2;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const t=horiz?i/w:j/h;
  if(t*16>BAYER[(y+j)&3][(x+i)&3]+0.5)c.fillRect(x+i,y+j,1,1);}}
function spk(c,x,y,w,h,col,d,seed){let s=seed||7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 c.fillStyle=col;for(let i=0;i<w*h*d;i++)c.fillRect((x+r()*w)|0,(y+r()*h)|0,1,1);}
function up(dst,src,scale,ox,oy){const d=dst.getContext('2d');d.imageSmoothingEnabled=false;
 d.drawImage(src,0,0,src.width,src.height,ox||0,oy||0,src.width*scale,src.height*scale);}

// smooth-character helper (mixel: drawn hi-res, composited over pixel world)
function roundRect(x2,a,b,w,h,r,col){x2.fillStyle=col;x2.beginPath();x2.roundRect(a,b,w,h,r);x2.fill();}

 // CHARACTER — designer-toy mixel: bigger round head, clean flats, soft shadow

 c.fillText('THE BIG GLITCH',304,178);c.fillText('KITCHEN, 02:07',304,192);c.fillText('DO NOT SCALE',304,205);
 c.fillStyle=OCH;c.fillText('SHEET 1',372,178);c.fillText('OF',372,192);c.fillText('555,789',372,205);
